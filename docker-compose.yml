
# Yarrow-Mullein Bank - Module 5 Part 3
# Five services: MongoDB, Flask, JavaScript,
# student portfolio, and NGINX gateway.

services:
  mongo:
    image: mongo:6
    volumes:
      - mongo_data:/data/db
    networks:
      - data
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    expose:
      - "5000"
    environment:
      MONGO_URI: mongodb://mongo:27017/bank_app
      SECRET_KEY: ymb-part3-local-development-secret
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - appnet
      - data

  transactions:
    build:
      context: ./transactions
      dockerfile: Dockerfile
    expose:
      - "3000"
    environment:
      MONGO_URI: mongodb://mongo:27017
      PORT: "3000"
    depends_on:
      mongo:
        condition: service_healthy
    networks:
      - appnet
      - data

  studentportfolio:
    build:
      context: ./studentportfolio
      dockerfile: Dockerfile
    expose:
      - "80"
    depends_on:
      - backend
    networks:
      - appnet

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - backend
      - transactions
      - studentportfolio
    networks:
      - appnet

volumes:
  mongo_data:

networks:
  appnet:
  data:
    internal: true
