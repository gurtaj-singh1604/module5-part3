
# This GitHub Actions workflow checks my Yarrow-Mullein
# Bank application whenever I push code to GitHub.
# It installs Python dependencies, runs tests, checks
# Docker Compose, and builds the Docker images.
# This helps identify problems before deployment.

name: YMB CI Pipeline

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install backend dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r backend/requirements.txt

      - name: Run Python tests
        run: python -m pytest -q

      - name: Validate Docker Compose
        run: docker compose config -q

      - name: Build Docker images
        run: docker compose build
