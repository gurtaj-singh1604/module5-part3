
# Yarrow-Mullein Bank - Module 5 Part 3
# NGINX routes browser requests to the correct service.

events {
    worker_connections 1024;
}

http {
    log_format ymb '$remote_addr "$request" $status -> $upstream_addr';
    access_log /var/log/nginx/access.log ymb;

    server {
        listen 80;

        # Requests with a user ID go to the JavaScript service.
        location /api/transactions/ {
            proxy_pass http://transactions:3000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # Other banking API routes go to Python Flask.
        location /api/ {
            proxy_pass http://backend:5000;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
        }

        # The student portfolio handles all other paths.
        location / {
            proxy_pass http://studentportfolio:80;
            proxy_set_header Host $host;
        }
    }
}
